[project]
name = "case-mgmt-ai-demo"
version = "0.1.0"
description = "Permit Review Assistant: cited AI Recommendations for business Permit Requests"
readme = "README.md"
authors = [
    { name = "Marco Nardone Guerra", email = "m.nardoneguerra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.14",
    "openai>=3.26.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
case-mgmt-ai-demo = "case_mgmt_ai_demo:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester"]
